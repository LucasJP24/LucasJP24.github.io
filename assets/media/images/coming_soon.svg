<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Used as a CSS mask: only the SHAPE and transparency matter, not the colour.
       The site's CSS paints it in the current theme's text colour. -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif" text-anchor="middle" fill="#000">
    <text x="400" y="258" font-size="76" font-weight="800" letter-spacing="-2">Coming soon</text>
    <!-- 60% opacity = lighter subtitle once masked -->
    <text x="400" y="306" font-size="24" font-weight="600" fill-opacity="0.6">Write-up in progress</text>
  </g>
</svg>
