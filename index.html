<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Pastoor | Game Programmer</title>
    <meta name="description"
        content="Lucas Pastoor, game programmer and procedural programmer studying Game Technology at BUas.">

    <!-- 1. Theme first, blocking on purpose: prevents a flash of the wrong theme -->
    <script src="assets/js/theme-init.js"></script>

    <!-- 2. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&display=swap">

    <!-- 3. Styles: shared → components → page -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components/site-header.css">
    <link rel="stylesheet" href="assets/css/components/button.css">
    <link rel="stylesheet" href="assets/css/components/tag.css">
    <link rel="stylesheet" href="assets/css/home.css">

    <!-- 4. Scripts: `defer` keeps this order and runs after the HTML is parsed.
            Data must load before the components that use it. -->
    <script defer src="data/tags.js"></script>
    <script defer src="data/projects.js"></script>
    <script defer src="assets/js/components/theme-toggle.js"></script>
    <script defer src="assets/js/components/tag.js"></script>
    <script defer src="assets/js/components/project-list.js"></script>
    <script defer src="assets/js/components/noise-field.js"></script>
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <a class="site-header__brand" href="./">Lucas Pastoor</a>
        <nav class="site-header__nav" aria-label="Main">
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
                <!-- Sun: shown in dark mode (switch to light) -->
                <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path
                        d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
                <!-- Moon: shown in light mode (switch to dark) -->
                <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
            </button>
        </nav>
    </header>

    <main id="main">
        <!-- ========== Hero ========== -->
        <section class="hero" aria-labelledby="hero-name">
            <canvas class="hero__field" data-noise-field aria-hidden="true"></canvas>

            <div class="hero__inner">
                <div class="hero__text">
                    <h1 class="hero__name" id="hero-name">
                        <span>Lucas</span>
                        <span>Pastoor</span>
                    </h1>
                    <p class="hero__role">Game programmer and procedural programmer.</p>
                    <p class="hero__study">
                        Studying Game Technology at <a href="https://www.buas.nl/" target="_blank"
                            rel="noopener">BUas</a>
                    </p>

                    <div class="hero__actions">
                        <a class="button button--primary" href="assets/files/Lucas_Pastoor_Resume.pdf" target="_blank"
                            rel="noopener">View resume</a>
                        <a class="button" href="#projects">See projects</a>
                    </div>
                </div>

                <img class="hero__photo" src="assets/media/images/lucas.png" alt="Portrait of Lucas Pastoor" width="300"
                    height="375">
            </div>

            <div class="hero__reseed">
                <span data-noise-seed></span>
                <button class="button button--small" type="button" data-noise-reseed>New terrain</button>
            </div>
        </section>

        <!-- ========== Projects ========== -->
        <section class="projects" id="projects" aria-labelledby="projects-title">
            <h2 class="section-title" id="projects-title">Projects</h2>

            <!-- Filled by project-list.js from data/projects.js -->
            <div class="project-list" data-project-list>
                <noscript>
                    <p>Turn on JavaScript to see my projects, or find them on
                        <a href="https://github.com/LucasJP24">GitHub</a>.
                    </p>
                </noscript>
            </div>
        </section>
    </main>

    <!-- ========== Contact ========== -->
    <footer class="site-footer" id="contact">
        <div class="site-footer__inner">
            <h2 class="section-title">Get in touch</h2>

            <!-- Icons are decorative (aria-hidden / empty alt): the label text
                 below each one already gives the link its name. -->
            <ul class="social-links">
                <li>
                    <a class="social-link" href="https://github.com/LucasJP24" target="_blank" rel="noopener">
                        <span class="social-link__icon social-link__icon--mono social-link__icon--github"
                            aria-hidden="true"></span>
                        <span class="social-link__label">GitHub</span>
                    </a>
                </li>
                <li>
                    <a class="social-link" href="https://www.linkedin.com/in/lucas-pastoor" target="_blank"
                        rel="noopener">
                        <!-- Full colour: LinkedIn's guidelines ask for the blue logo online -->
                        <img class="social-link__icon" src="assets/media/icons/linkedin.png" alt="" width="44"
                            height="44">
                        <span class="social-link__label">LinkedIn</span>
                    </a>
                </li>
                <li>
                    <a class="social-link" href="mailto:lucas.j.pastoor@gmail.com">
                        <span class="social-link__icon social-link__icon--mono social-link__icon--mail"
                            aria-hidden="true"></span>
                        <span class="social-link__label">Email</span>
                    </a>
                </li>
                <li>
                    <a class="social-link" href="assets/files/Lucas_Pastoor_Resume.pdf" target="_blank" rel="noopener">
                        <span class="social-link__icon social-link__icon--mono social-link__icon--resume"
                            aria-hidden="true"></span>
                        <span class="social-link__label">Resume</span>
                    </a>
                </li>
            </ul>

            <p class="site-footer__copy">© 2026 Lucas Pastoor</p>
        </div>
    </footer>

    <!-- ========== Template for ONE project ==========
         Not shown on its own. project-list.js copies it for every project in
         data/projects.js and fills the [data-field] slots. -->
    <template id="project-template">
        <article class="project">
            <div class="project__media" data-field="media">
                <img src="" alt="" loading="lazy">
            </div>
            <div class="project__body">
                <h3 class="project__title"><a data-field="title"></a></h3>
                <ul class="project__meta" data-field="meta"></ul>
                <ul class="tag-list" data-field="tags"></ul>
                <p class="project__description" data-field="description"></p>
                <span class="project__cta" aria-hidden="true">Read the write-up</span>
            </div>
        </article>
    </template>
</body>

</html>
